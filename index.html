<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="">
  <title>Interval Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="setup-view" class="view">
    <h1 id="setup-title">Timer setup</h1>
    <form id="setup-form">
      <div id="plan"></div>
      <div class="add-row">
        <button id="add-stage" type="button" class="secondary">+ Step</button>
        <button id="add-group" type="button" class="secondary" title="Add a block of steps that repeats">+ Repeat</button>
      </div>
      <p id="error" role="alert"></p>
      <div class="start-controls">
        <button type="submit" class="start" aria-label="Start timer" title="Start timer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
        <button type="button" class="sound-toggle" aria-label="Sound" aria-pressed="false" title="Sound off"></button>
      </div>
    </form>
  </main>

  <main id="timer-view" class="view" hidden>
    <div id="overall"><div id="overall-stages"></div><div id="overall-fill"></div></div>
    <div id="progress"></div>
    <div id="stage-head">
      <div id="stage-name"></div>
      <div id="stage-info"></div>
    </div>
    <div id="clock">00:00</div>
    <button id="confirm-reps" type="button" hidden>Confirm reps</button>
    <div class="controls">
      <button id="pause" type="button" aria-label="Pause" title="Pause"></button>
      <button id="back" type="button" aria-label="Stop and return to settings" title="Stop"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
      <button type="button" class="sound-toggle" aria-label="Sound" aria-pressed="false" title="Sound off"></button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
